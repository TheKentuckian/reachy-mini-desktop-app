name: Build Linux Packages

# Manually triggered from the Actions tab on any branch.
# Produces a .deb and .AppImage as a downloadable artifact — no release is
# created and nothing is published anywhere.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to the branch you run this from)'
        required: false
        type: string

jobs:
  build:
    name: Build .deb + AppImage
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            uv-wrapper -> target
          cache-on-failure: true
          shared-key: linux-x86_64-v2

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build sidecar (uv-trampoline)
        run: TARGET_TRIPLET=x86_64-unknown-linux-gnu bash ./scripts/build/build-sidecar-unix.sh

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libx11-dev \
            libxrandr-dev \
            libasound2-dev \
            libxdo-dev \
            libudev-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            file \
            libc-bin \
            dpkg-dev \
            libfuse2t64 \
            squashfs-tools \
            patchelf

      - name: Generate throwaway signing key
        # Tauri requires a signing key to produce .AppImage.tar.gz files.
        # We generate a temporary one here — the resulting .sig files won't
        # match tauri.conf.json's public key, so the auto-updater won't accept
        # this build. That's fine: this workflow is for local installation, not
        # for over-the-air updates.
        run: |
          yarn tauri signer generate -w ~/.tauri/reachy-mini.key --ci || true
          SIGNING_KEY=$(cat ~/.tauri/reachy-mini.key 2>/dev/null || echo "")
          echo "TAURI_SIGNING_PRIVATE_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $GITHUB_ENV

      - name: Build Tauri app
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: |
          rm -rf target/x86_64-unknown-linux-gnu/release/bundle
          yarn tauri build --target x86_64-unknown-linux-gnu

      - name: Inject post-install scripts into .deb
        # Adds the udev rules (USB access) and venv path-patching logic that
        # the upstream release workflow patches in post-build.
        working-directory: src-tauri
        run: |
          DEB_FILE=$(find target/x86_64-unknown-linux-gnu/release/bundle/deb -name "*.deb" | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "❌ No .deb file found"
            exit 1
          fi

          TEMP_DIR=$(mktemp -d)
          dpkg-deb -x "$DEB_FILE" "$TEMP_DIR/extract"
          dpkg-deb -e "$DEB_FILE" "$TEMP_DIR/extract/DEBIAN"
          cp linux/deb-postinst.sh "$TEMP_DIR/extract/DEBIAN/postinst"
          cp linux/deb-postrm.sh  "$TEMP_DIR/extract/DEBIAN/postrm"
          chmod +x "$TEMP_DIR/extract/DEBIAN/postinst" "$TEMP_DIR/extract/DEBIAN/postrm"
          dpkg-deb -b "$TEMP_DIR/extract" "$DEB_FILE"
          rm -rf "$TEMP_DIR"
          echo "✅ Post-install scripts injected: $DEB_FILE"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb     -name "*.deb"      -exec cp {} dist/ \;
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -name "*.AppImage" -exec cp {} dist/ \;
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/
          retention-days: 14
