name: Build Linux Packages

# Manually triggered from the Actions tab on any branch.
# Produces a .deb as a downloadable artifact — no release is created and
# nothing is published anywhere.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to the branch you run this from)'
        required: false
        type: string

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            uv-wrapper -> target
          cache-on-failure: true
          shared-key: linux-x86_64-v2

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build sidecar (uv-trampoline)
        run: TARGET_TRIPLET=x86_64-unknown-linux-gnu bash ./scripts/build/build-sidecar-unix.sh

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libx11-dev \
            libxrandr-dev \
            libasound2-dev \
            libxdo-dev \
            libudev-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            file \
            libc-bin \
            dpkg-dev

      - name: Build Tauri app (.deb only)
        working-directory: src-tauri
        env:
          PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
        run: |
          rm -rf target/x86_64-unknown-linux-gnu/release/bundle
          yarn tauri build --target x86_64-unknown-linux-gnu --bundles deb

      - name: Inject post-install scripts into .deb
        # Adds the udev rules (USB access) and venv path-patching logic that
        # the upstream release workflow patches in post-build.
        working-directory: src-tauri
        run: |
          DEB_FILE=$(find target/x86_64-unknown-linux-gnu/release/bundle/deb -name "*.deb" | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "❌ No .deb file found"
            exit 1
          fi

          TEMP_DIR=$(mktemp -d)
          dpkg-deb -x "$DEB_FILE" "$TEMP_DIR/extract"
          dpkg-deb -e "$DEB_FILE" "$TEMP_DIR/extract/DEBIAN"
          cp linux/deb-postinst.sh "$TEMP_DIR/extract/DEBIAN/postinst"
          cp linux/deb-postrm.sh  "$TEMP_DIR/extract/DEBIAN/postrm"
          chmod +x "$TEMP_DIR/extract/DEBIAN/postinst" "$TEMP_DIR/extract/DEBIAN/postrm"
          dpkg-deb -b "$TEMP_DIR/extract" "$DEB_FILE"
          rm -rf "$TEMP_DIR"
          echo "✅ Post-install scripts injected: $DEB_FILE"

      - name: Collect artifacts
        run: |
          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "GIT_SHA=${GIT_SHA}"       >> $GITHUB_ENV
          mkdir -p dist
          while IFS= read -r -d '' f; do
            base=$(basename "$f" .deb)
            cp "$f" "dist/${base}_${BUILD_DATE}_${GIT_SHA}.deb"
          done < <(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -name "*.deb" -print0)
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ env.BUILD_DATE }}-${{ env.GIT_SHA }}
          path: dist/
          retention-days: 14
